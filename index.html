<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지반 용사: 흙과 물의 시련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --page:#C9D3DE; --page2:#B7C3D0; --pageInk:#1C2436;
  --win1:#1D2C57; --win2:#0F1834; --winLine:#E9EEF7; --txt:#F2F4F8; --dim:#A9B6CF;
  --gold:#F2C14E; --hp:#E5484D; --fs:#3CCF91; --mp:#4AA3FF; --xp:#B48CFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0B1020; --page2:#121a30; --pageInk:#D9E1EE; color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#0B1020; --page2:#121a30; --pageInk:#D9E1EE; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);background-image:radial-gradient(var(--page2) 1px,transparent 1px);background-size:6px 6px;color:var(--pageInk);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100%}
#game{max-width:1080px;margin:0 auto;padding:12px 12px 150px;position:relative}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));color:var(--txt);border:3px solid var(--winLine);border-radius:8px;box-shadow:0 0 0 3px var(--win2),0 6px 0 3px rgba(0,0,0,.25);padding:12px 14px}
.dh{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%}
.hidden{display:none!important}

/* HUD */
.hud{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px}
.hud .nm{font-family:"Do Hyeon",sans-serif;font-size:22px}
.hud .lv{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold)}
.bar{position:relative;height:12px;width:110px;background:#0a0f22;border:2px solid #E9EEF7;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.stat b{color:var(--txt);font-family:"Press Start 2P",monospace;font-size:10px}
.seals{display:flex;gap:3px}
.seals span{width:20px;height:20px;border:2px solid #556;border-radius:4px;display:grid;place-items:center;font-size:12px;background:#0a0f22}
.seals span.on{border-color:var(--gold);background:#3a2e10}
.seals span.c2{border-style:dashed}
.seals span.c3{border-style:dotted}
.hud .menu{margin-left:auto;font-size:17px;min-height:36px;padding:3px 14px}
.hud .sp{background:var(--hp);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;font-family:"IBM Plex Sans KR"}

/* Title */
.title{text-align:center;padding:26px 16px 30px}
.title h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:clamp(46px,9vw,84px);margin:4px 0 0;color:var(--gold);text-shadow:4px 4px 0 #6b3d10,0 0 24px rgba(242,193,78,.35);line-height:1}
.title .sub{font-family:"Do Hyeon",sans-serif;font-size:clamp(20px,3.6vw,28px);margin:10px 0 18px}
.title p{color:var(--dim);max-width:580px;margin:0 auto 18px;line-height:1.6}
.title input{font:inherit;font-size:17px;padding:8px 12px;border-radius:6px;border:2px solid var(--winLine);background:#0a0f22;color:var(--txt);width:180px;text-align:center}
.title select{font:inherit;font-size:17px;padding:8px 12px;border-radius:6px;border:2px solid var(--winLine);background:#0a0f22;color:var(--txt);width:180px}
.title label{font-family:"Do Hyeon",sans-serif;font-size:19px}
.btn{font-family:"Do Hyeon",sans-serif;font-size:21px;background:#2b3f78;color:var(--txt);border:3px solid var(--winLine);border-radius:8px;padding:8px 20px;cursor:pointer;min-height:46px;box-shadow:0 4px 0 #0a0f22}
.btn:hover:not(:disabled){background:#38529b}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #0a0f22}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:#8a5a12;border-color:var(--gold)}
.btn.sm{font-size:16px;min-height:36px;padding:3px 12px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

/* World */
.worldWrap{position:relative;border:3px solid var(--winLine);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--win2);touch-action:manipulation}
.worldWrap canvas{aspect-ratio:24/15;cursor:default}
.maptag{display:none!important;position:absolute;left:8px;top:8px;padding:3px 10px;font-family:"Do Hyeon",sans-serif;font-size:17px;border-width:2px;box-shadow:none;pointer-events:none}
.hint{font-size:13px;color:var(--pageInk);opacity:.8;margin:8px 2px 0}
.dpad{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:150px;height:150px}
@media (pointer:coarse){.dpad{display:block}}
.dpad button{position:absolute;width:50px;height:50px;border-radius:10px;border:3px solid var(--winLine);background:rgba(29,44,87,.85);color:#fff;font-size:20px;padding:0}
.dpad .u{left:50px;top:0}.dpad .d{left:50px;top:100px}.dpad .l{left:0;top:50px}.dpad .r{left:100px;top:50px}.dpad .a{left:50px;top:50px;border-radius:50%;background:rgba(138,90,18,.9);font-family:"Do Hyeon";font-size:15px;white-space:nowrap}

/* Battle */
.btop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:860px){.btop{grid-template-columns:1fr}}
.stage{position:relative;border:3px solid var(--winLine);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--win2);display:flex;flex-direction:column;background:var(--win2)}
.scv{position:relative}
.stage canvas{aspect-ratio:2/1}
.sbars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;padding:6px;flex:1;align-content:start}
.sbars .win{box-shadow:none;border-width:2px}
.bossbar{padding:8px 10px}
.bossbar .n{font-family:"Do Hyeon",sans-serif;font-size:22px;line-height:1}
.bossbar .t{font-size:12px;color:var(--dim);margin-bottom:6px}
.bossbar .bar{width:100%;height:14px}
.bossbar .fsl{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:13px;color:var(--dim);gap:8px}
.bossbar .fsl b{font-family:"Press Start 2P",monospace;font-size:14px;color:var(--fs)}
.turnbar{padding:7px 10px;font-size:13px;line-height:1.9}
.tsep{display:none}
.turnbar b{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--gold)}
.forecast{grid-column:1/-1;padding:6px 10px;font-size:13.5px;line-height:1.6}
.forecast b{color:var(--gold)}
@media (max-width:640px){ .sbars{grid-template-columns:1fr} .hud .bar{width:72px} }
.float{position:absolute;font-family:"Press Start 2P",monospace;font-size:16px;pointer-events:none;text-shadow:2px 2px 0 #000;animation:flt 1.4s ease-out forwards}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.bscr:not(.hidden){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"stage field" "cmd cmd";gap:14px}
.bscr .btop{display:contents}.bscr .stage{grid-area:stage}.bscr .field{grid-area:field}.bscr .bgrid{grid-area:cmd}
@media (max-width:860px){.bscr:not(.hidden){grid-template-columns:1fr;grid-template-areas:"stage" "cmd" "field";gap:10px}}
@media (max-width:640px){
  #game{padding:8px 8px 130px}
  .hud{padding:6px 8px;gap:4px 10px;margin-bottom:8px}.hud .nm{font-size:18px}.hud .stat{font-size:12px}.seals span{width:16px;height:16px;font-size:10px}
  .sbars{gap:4px;padding:4px}.sbars .win{padding:5px 8px}
  .turnbar{line-height:1.5;font-size:12px}.turnbar br{display:none}.tsep{display:inline!important}.turnbar b{margin-right:6px}
  .bossbar .n{font-size:18px}.bossbar .t{display:none}.bossbar .fsl{margin-top:3px}
  .forecast{font-size:12.5px;padding:4px 8px}
  .cmd{padding:8px 10px}.cmd h3{display:none}
  .cmdgrid{grid-template-columns:repeat(4,1fr)!important;gap:5px}.cmdgrid .btn{font-size:14px!important;min-height:36px!important;padding:2px 4px!important;box-shadow:0 2px 0 #0a0f22}
  .skills{grid-template-columns:1fr;gap:5px;margin-top:6px}
  .skill{padding:6px 8px}.skill .sn{font-size:16px}
  .skill .sd{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .skill .pv{font-size:12px}
  .predtog{font-size:12px;margin-top:6px}
  .field{padding:8px 10px}.field h3{font-size:16px}.params{grid-template-columns:auto auto auto auto;font-size:12.5px;gap:1px 8px}
  .formula{font-size:13.5px}
  .msg{min-height:84px;padding:10px 12px 12px}.msg p{font-size:15px}.msg .who{font-size:17px}.skipall{font-size:12px;top:6px}
}
.bgrid{margin-top:0}
.field{display:flex;flex-direction:column}
.field h3,.cmd h3{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:19px;margin:0 0 6px}
.field canvas{width:100%;aspect-ratio:16/9;display:block;background:#0a0f22;border-radius:4px}
.params{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:10px 0 0;font-size:14px}
.params dt{color:var(--dim)}
.params dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.params dd.q{color:#7d89a8}
.cmdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.cmdgrid{grid-template-columns:1fr 1fr}}
.cmdgrid .btn{font-size:19px;padding:6px 10px;min-height:44px}
.skills{display:grid;gap:7px;margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;font:inherit;color:var(--txt);background:#16234a;border:2px solid #6c7da8;border-radius:6px;padding:8px 10px;cursor:pointer}
.skill:hover:not(:disabled){border-color:var(--gold);background:#1e2e5e}
.skill:disabled{opacity:.38;cursor:not-allowed}
.skill .sn{font-family:"Do Hyeon",sans-serif;font-size:19px}
.skill .sc{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--mp);align-self:center}
.skill .sd{grid-column:1/-1;font-size:13px;color:var(--dim);line-height:1.45}
.skill .pv{grid-column:1/-1;font-size:13px;font-weight:700}
.tag{display:inline-block;font-size:11px;border:1px solid #6c7da8;border-radius:3px;padding:0 4px;margin-left:6px;color:var(--dim);font-family:"IBM Plex Sans KR";vertical-align:2px}
.calcbox{margin-top:10px;background:#0f1834;border:2px solid #34446f;border-radius:6px;padding:8px 10px}
.calcbox summary{font-family:"Do Hyeon",sans-serif;font-size:17px;cursor:pointer}
.formula{font-family:"Times New Roman",Georgia,serif;font-size:15.5px;line-height:1.75;background:#0a0f22;border-radius:4px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.formula sub,.formula sup{font-size:.72em}
table.dtab{border-collapse:collapse;margin:8px 0;font-size:15px}
table.dtab td,table.dtab th{border:1px solid #34446f;padding:5px 10px;text-align:left}
.hintf summary{cursor:pointer;color:var(--gold);font-size:14px;margin-top:6px}
.predtog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);margin-top:8px;cursor:pointer}
.insight{color:var(--gold);font-size:13px;font-weight:700;margin-top:8px}

/* Message */
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(1056px,calc(100% - 24px));z-index:30;min-height:104px;cursor:pointer;padding:12px 18px 14px}
.skipall{position:absolute;right:10px;top:8px;font:inherit;font-size:13px;background:rgba(255,255,255,.08);color:var(--dim);border:1px solid #6c7da8;border-radius:999px;padding:3px 10px;cursor:pointer}
.skipall:hover{color:var(--txt);border-color:var(--gold)}
.msg .who{font-family:"Do Hyeon",sans-serif;font-size:19px;color:var(--gold);display:block;margin-bottom:2px}
.msg p{margin:0;font-size:16.5px;line-height:1.6;white-space:pre-line}
.msg .nx{position:absolute;right:14px;bottom:8px;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opts .btn{font-size:18px;min-height:40px;padding:4px 14px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,8,20,.72);z-index:40;display:grid;place-items:center;padding:16px}
.modal > .win{width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px 20px}
.modal.wide > .win{width:min(860px,100%)}
.modal h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:30px;margin:0 0 8px;color:var(--gold)}
.modal h4{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:20px;margin:14px 0 6px}
.modal p{line-height:1.65;margin:8px 0}
.qopts{display:grid;gap:8px;margin-top:12px}
.qopts button{font:inherit;font-size:16px;text-align:left;color:var(--txt);background:#16234a;border:2px solid #6c7da8;border-radius:6px;padding:10px 12px;cursor:pointer;line-height:1.45}
.qopts button.ok{border-color:var(--fs);background:#11402f}
.qopts button.no{border-color:var(--hp);background:#4a1a22}
.reward{display:flex;gap:10px 16px;flex-wrap:wrap;font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);margin:10px 0;line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font-family:"Do Hyeon",sans-serif;font-size:18px;background:#16234a;color:var(--txt);border:2px solid #6c7da8;border-radius:6px;padding:4px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1d2c57;border-color:var(--gold)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mhead .x{font-size:22px;background:none;border:none;color:var(--txt);cursor:pointer;padding:4px 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{background:#16234a;border:2px solid #6c7da8;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card.on{border-color:var(--gold)}
.card .cn{font-family:"Do Hyeon",sans-serif;font-size:19px}
.card .cd{font-size:13px;color:var(--dim);line-height:1.45;flex:1}
.card .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:13px}
.card.locked{opacity:.45}
.stars{color:var(--gold);letter-spacing:1px}
table.rank{width:100%;border-collapse:collapse;font-size:14px}
table.rank th,table.rank td{padding:6px 6px;border-bottom:1px solid #34446f;text-align:left;white-space:nowrap}
table.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
table.rank tr.me td{color:var(--gold);font-weight:700}
.tscroll{overflow-x:auto}
.note{font-size:13px;color:var(--dim);line-height:1.55}
.inp{font:inherit;font-size:15px;padding:6px 10px;border-radius:6px;border:2px solid #6c7da8;background:#0a0f22;color:var(--txt);width:150px}
.score{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:14px;margin:8px 0}
.score dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.score .tot{font-weight:700;color:var(--gold);border-top:1px solid #34446f;padding-top:4px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 현장 단면을 전투 장면 배경으로 */
.scv #cvField{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;background:linear-gradient(180deg,#22345f 0%,#121c3a 55%,#0a0f22 100%);z-index:0}
.scv #cvStage{position:relative;z-index:1}
.scv #floats{position:absolute;inset:0;z-index:2;pointer-events:none}
.scv{transition:none}
/* 전투 대화창: 전투 장면 아래쪽에 겹쳐 표시 */
.scv .msg{position:absolute;left:6px;right:6px;bottom:6px;top:auto;transform:none;width:auto;min-height:0;max-height:78%;overflow:auto;padding:8px 12px 28px;z-index:5;box-shadow:0 0 0 2px var(--win2)}
.scv .msg p{font-size:15px;line-height:1.5}.scv .msg .who{font-size:16px}.scv .msg .opts{margin-top:6px}.scv .msg .opts .btn{font-size:15px;min-height:34px;padding:2px 10px}
.scv .msg .skipall{top:auto;bottom:5px;right:28px;font-size:11.5px;padding:2px 8px}
.scv .msg .nx{bottom:5px}
@media (max-width:760px){ .scv .msg{max-height:92%;padding:6px 10px 26px}.scv .msg p{font-size:14px} }

/* 대화창은 화면 고정이 아니라 현재 화면 안에 붙인다 (뷰어 하단 UI에 가려지지 않게) */
.worldWrap .msg{position:absolute;left:8px;right:8px;bottom:8px;top:auto;transform:none;width:auto;min-height:0;max-height:72%;overflow:auto;padding:10px 14px 30px;z-index:5;box-shadow:0 0 0 2px var(--win2)}
#scrTitle .msg{position:relative;left:auto;bottom:auto;transform:none;width:auto;max-width:640px;margin:18px auto 0;text-align:left;min-height:0;padding-bottom:14px}
.worldWrap .msg .skipall{top:auto;bottom:6px;right:30px;font-size:11.5px;padding:2px 8px}
.worldWrap .msg .nx{bottom:6px}
@media (max-width:760px){ .worldWrap .msg{position:relative;left:auto;right:auto;bottom:auto;margin:0;border-radius:0;border-width:3px 0 0;max-height:none} .worldWrap .msg p{font-size:15px} }

/* ===== 넓은 화면 레이아웃: 창 폭에 맞추고, 계산서는 명령 옆으로 ===== */
#game{max-width:min(97vw,1900px)}
.worldWrap{margin:0 auto}
.worldWrap canvas{aspect-ratio:auto!important}
.bscr:not(.hidden){display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);grid-template-areas:"stage stage" "cmd field";gap:12px}
.bscr .btop{display:contents}
.bscr .stage{grid-area:stage;flex-direction:row}
.bscr .field{grid-area:field;margin:0}
.bscr .bgrid{grid-area:cmd;margin:0}
.bscr .scv{flex:1 1 auto;min-width:0;aspect-ratio:2.5/1;max-height:62vh}
.bscr .scv #cvStage{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.bscr .sbars{flex:0 0 300px;grid-template-columns:1fr;align-content:start}
.bscr .field h3{font-size:17px}
@media (max-width:860px){
  .bscr:not(.hidden){grid-template-columns:1fr;grid-template-areas:"stage" "cmd" "field";gap:10px}
  .bscr .stage{flex-direction:column}
  .bscr .scv{aspect-ratio:2/1;max-height:none}
  .bscr .sbars{flex:none}
}
@media (pointer:fine){ #game{padding-bottom:16px} }
@media (min-width:861px){
  .bscr .cmd h3{display:none}
  .bscr .cmd{padding:10px 12px}
  .bscr .skills{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
  .bscr .skill{padding:6px 9px}
  .bscr .skill .sn{font-size:17px}
  .bscr .skill .sd{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bscr .cmdgrid .btn{min-height:40px;font-size:18px;padding:4px 8px}
  .bscr .predtog{margin-top:6px}
  .bscr .field{padding:10px 14px}
  .bscr .turnbar{line-height:1.6}
}
.sbars .msg{position:relative;left:auto;right:auto;bottom:auto;top:auto;transform:none;width:auto;min-height:0;max-height:none;margin:0;padding:8px 10px 30px;box-shadow:none;border-width:2px;grid-column:1/-1;z-index:auto}
.sbars .msg p{font-size:14.5px;line-height:1.55}.sbars .msg .who{font-size:15px}.sbars .msg .opts .btn{font-size:15px;min-height:34px;padding:2px 10px}

/* ---- 오류가 나면 화면에 표시 (학생이 캡처해서 알려줄 수 있게) ---- */
(function(){
  const show = msg => { try { let t = document.getElementById('errToast'); if (!t){ t = document.createElement('div'); t.id = 'errToast'; t.setAttribute('role','alert');
      t.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:99;background:#4a1a22;color:#fff;border:2px solid #E5484D;border-radius:8px;padding:8px 12px;font:13px/1.5 sans-serif;white-space:pre-wrap';
      t.onclick = () => t.remove(); document.body.appendChild(t); }
    t.textContent = '⚠ 오류가 났어요. 이 화면을 캡처해서 알려 주세요 (누르면 닫힘)\n' + msg + '\n' + navigator.userAgent; } catch(e){} };
  window.addEventListener('error', e => show((e.message || '') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')));
  window.addEventListener('unhandledrejection', e => show('Promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
})();

function maxHp(){ const r = jobR(); return 100 + 15*(P.lv-1) + (hasPerk('hp')?40:0) + (eq('head')?.hp||0) + (P.job==='pubcorp' ? 40 + 10*r : 0); }
function maxBud(){ const r = jobR(); return Math.floor(12 + 1.5*(P.lv-1)) + (hasPerk('vet')?4:0) + (hasPerk('fore')?2:0) + (P.job==='official' ? 4 + r : 0); }
function surveyCost(){ if (isRes()) return 0; return Math.max(0, 2 - (eq('survey')?.sc||0)); }
function effMul(tag){ const r = jobR(); return (hasPerk(tag)?1.25:1) * (eq('tool')?.mul||1) * (P.job==='designer' ? 1.15 + 0.05*r : 1); }
function costOf(sk){ if (sk.trap) return 0; const r = jobR(); return Math.max(1, sk.cost - (hasPerk('cost')?1:0) - (P.job==='contractor' ? (r>=3?2:1) : 0)); }
function dmgMul(){ const r = jobR(); return (hasPerk('crisis')?0.6:1) * (eq('head')?.dmg||1) * (P.job==='pubcorp' ? 0.7 - 0.05*r : 1); }
const foresight = () => hasPerk('fore') || !!eq('survey')?.fore;
const insightMul = () => isRes() ? (isTop()?2.5:2.0) : hasPerk('scholar') ? 1.8 : 1.5;
const quizBud = () => 3 + (hasPerk('scholar')?2:0) + (isRes() ? 2 + jobR() : 0);
const specUses = () => P.job === 'student' ? 0 : isTop() ? 2 : 1;

    $('msgSkip').classList.remove('hidden');

function gainXP(n){
  const ev = []; P.xp += n;
  while (P.lv < MAXLV && P.xp >= XPNEED[P.lv]){ P.lv++; P.sp++; ev.push(`LEVEL UP! → LV ${P.lv} (스킬 포인트 +1)`); }
  if (ev.length) P.hp = maxHp();
  for (const r of updateRank()) ev.push(`승진! ${r}`);
  return ev;
}
function updateRank(){
  if (P.job === 'student') return [];
  const lv = rankLvOf(P.job), ex = examOf(P.job), out = [];
  while (P.rank + 1 < lv.length && P.lv >= lv[P.rank+1]){ if (ex[P.rank+1] && !P.examOK[P.rank+1]) break; P.rank++; out.push(ranksOf(P.job)[P.rank]); }
  return out;
}
function examReady(){ if (P.job === 'student') return null; const i = P.rank + 1, lv = rankLvOf(P.job), ex = examOf(P.job); return (i < lv.length && ex[i] && !P.examOK[i] && P.lv >= lv[i]) ? {i, name:ex[i]} : null; }
const canChangeJob = () => P.job === 'student' && P.lv >= 5;

      await modal(`<h2>${JOBS[P.job].icon} ${JOBS[P.job].name}의 길</h2><p>${P.name}은(는) ${jobTitle()}(으)로 새 출발한다!</p><p>${JOBS[P.job].desc}</p>${ups.length ? `<p style="color:var(--gold)">경력이 인정되어 바로 승진: ${ups.join(', ')}</p>` : ''}<div class="row" style="justify-content:flex-end"><button class="btn gold" data-close>좋아!</button></div>`);

async function takeExam(){
  const ex = examReady(); if (!ex) return;
  const fee = 100;
  if (P.gold < fee){ await modal(`<h2>${ex.name}</h2><p>응시료 ${fee}만원이 필요하다.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>확인</button></div>`); return; }
  P.gold -= fee;
  const qs = [...ALLQUIZ].sort(() => Math.random() - 0.5).slice(0, 3); let ok = 0;
  for (let i = 0; i < 3; i++){ if (await quizModal(qs[i], `${ex.name} (${i+1}/3)`)) ok++; else break; }
  if (ok === 3){ P.examOK[ex.i] = true; const ups = updateRank(); gainXP(100); save(); syncRank(); renderHud();
    await modal(`<h2>합격!</h2><p>${ex.name}을(를) 통과했다. 이제 ${jobTitle()}이다!</p><div class="reward"><span>EXP +100</span>${ups.map(u => `<span>${u}</span>`).join('')}</div><div class="row" style="justify-content:flex-end"><button class="btn gold" data-close>만세!</button></div>`); }
  else { save(); renderHud(); await modal(`<h2>불합격…</h2><p>세 문제를 모두 맞혀야 한다. 공부해서 다시 도전하자. (응시료 ${fee}만원)</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>다시 공부하자</button></div>`); }
}

  });

/* ===== 흙 감정 의뢰 (USCS 분류) ===== */
const USCS = ['GW','GP','SW','SP','SM','SC','ML','CL','MH','CH'];
const USCS_N = {GW:'입도 양호한 자갈',GP:'입도 불량한 자갈',SW:'입도 양호한 모래',SP:'입도 불량한 모래',SM:'실트질 모래',SC:'점토질 모래',ML:'저소성 실트',CL:'저소성 점토',MH:'고소성 실트',CH:'고소성 점토'};
const CLIENTS = ['물류센터 부지','하천 제방','아파트 터파기','항만 매립지','고속도로 성토','공장 기초','터널 갱구부','신도시 택지','댐 코어 재료','학교 운동장'];
const aLine = LL => 0.73*(LL - 20);
function genSoil(){
  const sym = pick(USCS), coarse = 'GS'.includes(sym[0]), o = {sym, site: pick(CLIENTS)};
  if (coarse){
    const clean = 'WP'.includes(sym[1]); o.F = clean ? rr(1,4) : rr(15,40);
    const gfrac = sym[0] === 'G' ? rr(0.58,0.85) : rr(0.08,0.4); o.Gr = (100 - o.F)*gfrac; o.Sa = 100 - o.F - o.Gr;
    if (sym[1] === 'W'){ o.Cu = sym[0] === 'G' ? rr(5,15) : rr(7,18); o.Cc = rr(1.2,2.6); }
    else if (sym[1] === 'P'){ if (Math.random() < 0.5){ o.Cu = rr(1.8, sym[0] === 'G' ? 3.5 : 5); o.Cc = rr(0.9,1.8); } else { o.Cu = rr(6,14); o.Cc = pick([rr(0.3,0.8), rr(3.5,5)]); } }
    else { o.Cu = rr(8,30); o.Cc = rr(0.6,2.5); }
    o.D10 = sym[0] === 'G' ? rr(0.15,0.6) : rr(0.07,0.2); o.D60 = o.D10*o.Cu; o.D30 = Math.sqrt(o.Cc*o.D10*o.D60);
    if (sym[1] === 'M'){ o.LL = rr(22,40); o.PI = Math.max(1, aLine(o.LL) - rr(2,6)); }
    if (sym[1] === 'C'){ o.LL = rr(25,45); o.PI = Math.max(8, aLine(o.LL) + rr(3,10)); }
  } else {
    o.F = rr(58,96); o.Gr = rr(0, (100 - o.F)*0.3); o.Sa = 100 - o.F - o.Gr;
    o.LL = sym[1] === 'H' ? rr(55,85) : rr(28,47);
    o.PI = sym[0] === 'C' ? Math.max(8, aLine(o.LL) + rr(3,14)) : Math.max(2, aLine(o.LL) - rr(3,10));
  }
  if (o.LL) o.PL = o.LL - o.PI;
  return o;
}

function bfs(tx, ty){

  while (q.length){ const [x,y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x+dx, ny = y+dy, k = key(nx,ny); if (prev.has(k) || !walkable(nx,ny)) continue; prev.set(k, [x,y]); q.push([nx,ny]); } }

}

function genQuest(){
  const types = P.cleared.slice(); if (!types.length) return null;
  for (let tries = 0; tries < 40; tries++){
    const type = pick(types), B = BOSSES[type], over = B.rand(), st = Object.assign(B.init(), over);
    let ok;
    if (type === 'consol') ok = true;
    else if (B.finish){ const c = structuredClone(st); B.finish(c); const v = B.fs(c); ok = v > 0.5*B.target && v < 0.87*B.target; }
    else { const v = B.fs(st); ok = v > 0.8 && v < B.target*0.85; }
    if (!ok) continue;
    const stars = pick([1,2,2,3]);
    return {id: Math.random().toString(36).slice(2,9), type, stars, title: pick(B.qt).replace('{loc}', pick(LOCS)), over,
      gold: 100*stars + (B.ch === 2 ? 150 : 0) + 5*P.lv, xp: 40*stars + (B.ch === 2 ? 50 : 0) + 3*P.lv};
  }
  return null;
}

  const code = $('inCode').value.trim().toLowerCase(); if (!code) return;
  $('btnCode').disabled = true; $('cloudNote').textContent = '불러오는 중…';
  try { const r = await api('loadSave', code); if (!r || !r.ok || !r.json) throw 0;
    P = normalize(JSON.parse(r.json)); P.code = code; try { localStorage.setItem('geo-rpg-code', code); } catch(e){} CL.uid = code;
    $('scrTitle').classList.add('hidden'); save(); showWorld(); }
  catch(e){ $('cloudNote').textContent = '그 저장 코드를 찾지 못했어요. 코드를 다시 확인해 주세요.'; $('btnCode').disabled = false; }
};
$('btnCont').onclick = () => { P = bestSave(); if (!P) return; const c = $('inCls').value.trim(); if (c && c !== P.cls){ P.cls = c; } $('scrTitle').classList.add('hidden'); save(); syncRank(); showWorld(); };
dockMsg($('scrTitle')); refreshTitle(); drawTitle(); initCloud();

/* 큰 화면에서는 창 크기에 맞춰 게임 전체를 확대 */
/* 전투 화면: 계산서를 접은 상태에서 스크롤 없이 한 화면에 들어오도록 전투 장면 높이를 맞춤 */
function fitBattle(){
  const scv = document.querySelector('.bscr .scv'); if (!scv) return;
  if (typeof BT === 'undefined' || !BT || innerWidth <= 860){ scv.style.height = ''; scv.style.aspectRatio = ''; scv.style.maxHeight = ''; const sb0 = document.querySelector('.bscr .sbars'); if (sb0) sb0.style.maxHeight = ''; return; }
  const hud = $('hud').offsetHeight || 0, cmd = document.querySelector('.bscr .bgrid').offsetHeight;
  const fld = document.querySelector('.bscr .field'), cal = $('calc');
  const fh = fld.offsetHeight - (cal && cal.open ? cal.offsetHeight - (cal.querySelector('summary') ? cal.querySelector('summary').offsetHeight + 18 : 0) : 0);
  const avail = innerHeight - hud - Math.max(cmd, fh) - 12*2 - 36;
  const w = scv.getBoundingClientRect().width;
  const hgt = Math.round(Math.max(220, Math.min(avail, w/1.7)));
  const sbe = document.querySelector('.bscr .sbars'), lk = $('forecast'), sb = lk ? Math.ceil(lk.getBoundingClientRect().bottom - sbe.getBoundingClientRect().top + 6) : 0, H = Math.max(hgt, sb);
  const prev = scv.style.height; scv.style.aspectRatio = 'auto'; scv.style.maxHeight = 'none'; scv.style.height = H + 'px';
  sbe.style.maxHeight = H + 'px';
  if (prev !== H + 'px') drawField();
}
addEventListener('resize', () => requestAnimationFrame(fitBattle));
function fitScale(){ const g = document.getElementById('game'); if (!g) return; const z = Math.min(innerWidth/1100, innerHeight/900, 2.4); g.style.zoom = ''; if (typeof BT !== 'undefined' && BT && typeof drawField === 'function') drawField(); }
addEventListener('resize', fitScale); fitScale();
})();
</script>
